# Define the V1 (blue) Kubernetes Deployment here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
        - name: myapp
          image: raghuacr2026.azurecr.io/myapp:v1
          ports:
            - containerPort: 80