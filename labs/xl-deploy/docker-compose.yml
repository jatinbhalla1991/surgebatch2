services:
  xl-deploy:
    image: xebialabs/xl-deploy:24.1
    container_name: xl-deploy
    environment:
      ACCEPT_EULA: "Y"
      ADMIN_PASSWORD: admin123
    ports:
      - "4516:4516"
    volumes:
      - xld-data:/opt/xebialabs/xl-deploy-server/repository
    networks: [xld]

  # Target server that XL Deploy deploys to over SSH
  target-server:
    image: linuxserver/openssh-server:latest
    container_name: target-server
    hostname: target-server
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "true"
      USER_NAME: deployer
      USER_PASSWORD: deployer123
    networks: [xld]

volumes:
  xld-data:

networks:
  xld:
