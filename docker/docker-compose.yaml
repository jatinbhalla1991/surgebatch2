version: '3'
services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    image: jatinbhalla1991/sampletest
    ports:
      - "80:80"
  backend:
    image: redis:latest
    ports:
      - "6379:6379"
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local