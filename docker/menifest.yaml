---
apiVersion: v1
kind: Namespace
metadata:
  name: sample

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: sample
spec:
  replicas: 2
  # maxSurge: 0 means Kubernetes frees capacity (terminates an old pod) before
  # starting a new one, avoiding "Insufficient cpu" deadlocks on small/tightly
  # packed clusters where there's no spare room for a temporary extra replica.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
      - name: sample
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: sample
spec:
  type: LoadBalancer
  selector:
    app: sample
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

